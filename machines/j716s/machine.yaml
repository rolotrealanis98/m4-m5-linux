      upstream: ["omacom/m1n1#36"]
      verified: "2026-11-07"
      note: "A/B stage 1 with a 150 s watchdog and self-reverting test payloads. Rule: 60 s of idle after any large write before a reboot. A hang inside Linux init after Linux owns the watchdog is not covered (Thunderbolt T0). The stage-mark change to stage 1 waits for an attended sitting."
