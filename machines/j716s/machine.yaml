features:
  boot.untethered:
    - setup: j716s-aurora73
      state: works-daily
      kind: native
      evidence: [results/2026-11-07-daily-n1k.md#results, results/2026-11-08-daily-dcp-lfix-vrr.md#results]
      upstream: ["omacom/m1n1#33", "aurora-silicon/linux#1167", "omacom/linux-aurora#413"]
      verified: "2026-11-08"
      note: "Stage 1 on the boot slot, payload on the ESP, no cable. The daily is daily-dcp-lfix-vrr (50 s to ssh); the J716s device tree is upstream (#1167 merged 2026-11-08). The omacom m1n1 stack rebased on #30 140a36b also booted first pass (results/2026-11-08-omacom-wdt-keep-r2.md)."
  boot.safety:
    - setup: j716s-aurora73
      state: works-daily
      kind: native
      evidence: [results/2026-11-07-boot-safety-settle.md#restart-exp4-the-cause-of-the-first-boot-of-a-fresh-payload-falls-back, results/2026-11-08-loop-safety.md#results]
      upstream: ["omacom/m1n1#36"]
      verified: "2026-11-08"
      note: "A/B stage 1 with a 150 s watchdog and self-reverting test payloads; since 2026-11-08 systemd owns the watchdog on the daily (RuntimeWatchdogSec=60) and test payloads reset a hung init (boot.loop-safety). Rule: 60 s of idle after any large write before a reboot; a first write-and-reboot can still be counted as a failed restart (boot.counted-restart). The stage-mark change to stage 1 (0017) waits for an attended sitting."
  boot.loop-safety:
    - setup: j716s-aurora73
      state: works-test
      kind: native
      evidence: [results/2026-11-08-loop-safety.md#results, results/2026-11-08-loop-safety.md#v1-0322-utc-for-the-record, results/2026-11-08-tb-t0.md#analysis]
      upstream: ["omacom/m1n1#36"]
      verified: "2026-11-08"
      note: "Test payloads carry watchdog.open_timeout=300 and an initramfs opener that hands the watchdog to systemd. Negative test: a boot that reaches userspace and never opens the device is reset at about 150 s and stage 1 falls back, stage of death recorded. Positive test: hand-over to systemd passes (RuntimeWatchdogUSec=1min). Not exercised: the original Thunderbolt T0 hang inside kernel init (the open timeout should cover it by design; only the never-opens-the-device case was run) and lid-close sleep under the systemd watchdog (attended). Open work: tracker issues #1 and #8."
  boot.counted-restart:
    - setup: j716s-aurora73
      state: blocked
      kind: native
      evidence: [results/2026-11-07-boot-safety-settle.md#restart-exp4-the-cause-of-the-first-boot-of-a-fresh-payload-falls-back, results/2026-11-08-daily-dcp-lfix.md#counted-restart-on-the-first-write, "https://github.com/rolotrealanis98/m4-m5-linux/issues/15"]
      note: "A reboot while the SSD is still busy after a write burst is counted by iBoot as a failed boot, so the next stage-1 pass falls back before reading the new file (about 1 in 3 immediate reboots after a burst; 0 failures in 17 with at least 60 s idle). The workaround is the 60 s idle rule and a 20 s shutdown settle hook; the kernel-side fix (three NVMe/SMC shutdown patches) is written and compile-checked, not run, and stage-1 0017 (a counted restart boots the primary) waits for an attended install. Open work: tracker issues #15 and #5."
  boot.omarchy-chain:
