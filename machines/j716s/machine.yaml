    stack:
      kernel: "asahi-wip 7.2 with the omarchy-m5 J716s patches (7.2.2)"
      loader: "m1n1 stage 2 on the ESP"
      userspace: "Arch Linux ARM"
    current_build: null
    notes: "The first stack (2026-10-20 to 2026-11-06), retired. It proved SMP, the boot chain, NVMe, the trackpad, battery and cpufreq; everything carried over to the Aurora kernel. Its results are supporting evidence for the cells of j716s-aurora73."
notes: "SMP on this board needs the stub firmware from macOS 27.3 beta 1 or later (see topics/boot-chain). Every ESP write is followed by 60 s of idle before a reboot."
features:
