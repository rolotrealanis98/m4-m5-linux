      upstream: ["omacom/m1n1#30"]
      note: "A/B stage 1, m1n1, U-Boot, Limine, the daily kernel as an EFI-stub image: built, not booted. Needs a cold start with a person present (only the 150 s stage-1 watchdog as fallback). Open work: tracker issue #6."
